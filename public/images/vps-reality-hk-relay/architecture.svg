<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="720" viewBox="0 0 1120 720" role="img" aria-labelledby="title desc">
  <title id="title">VPS Reality 双线路与监控架构</title>
  <desc id="desc">Clash Verge Rev 可以直连美国 Xray，或通过 IPv6 连接香港 HAProxy，再经 IPv4 转发到美国。两条路径使用同一美国出口。Python 监控采集 Mihomo API、服务器 SSH 指标和主动探测结果，存入 SQLite 并展示在网页。</desc>
  <defs>
    <marker id="blue" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0 0L10 5L0 10" fill="#2563eb"/></marker>
    <marker id="green" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0 0L10 5L0 10" fill="#07866c"/></marker>
    <marker id="gray" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto"><path d="M0 0L9 4.5L0 9" fill="#64748b"/></marker>
    <style>
      text{font-family:"Microsoft YaHei","PingFang SC","Noto Sans CJK SC",Arial,sans-serif;fill:#172b4d}
      .heading{font-size:20px;font-weight:700}.body{font-size:16px}.small{font-size:14px;fill:#52647c}
      .box{fill:#fff;stroke:#cbd5e1;stroke-width:1.5}.blue{fill:none;stroke:#2563eb;stroke-width:3;marker-end:url(#blue)}
      .green{fill:none;stroke:#07866c;stroke-width:3;marker-end:url(#green)}.data{fill:none;stroke:#64748b;stroke-width:1.8;stroke-dasharray:6 5;marker-end:url(#gray)}
    </style>
  </defs>
  <rect width="1120" height="720" rx="20" fill="#f5f8fc"/>
  <text x="48" y="54" font-size="28" font-weight="700">VPS Reality：双线路与监控架构</text>
  <text x="48" y="85" class="body" fill="#52647c">香港负责 TCP 转发，美国负责 Reality 握手和最终出网</text>

  <rect x="36" y="115" width="1048" height="340" rx="18" fill="#edf3fa"/>
  <text x="58" y="146" class="small">业务流量 · 两条线路手动切换</text>

  <path d="M180 228V183H689V228" class="blue"/>
  <rect x="338" y="166" width="224" height="32" rx="8" fill="#edf3fa"/>
  <text x="450" y="188" text-anchor="middle" class="body" style="fill:#2563eb">美国直连 · IPv4 / TCP 443</text>

  <rect x="65" y="228" width="230" height="145" rx="14" class="box"/>
  <rect x="65" y="228" width="230" height="6" rx="3" fill="#2563eb"/>
  <text x="180" y="265" text-anchor="middle" class="heading">本机 / 移动宽带</text>
  <text x="180" y="295" text-anchor="middle" class="body">Clash Verge Rev · Mihomo</text>
  <text x="180" y="323" text-anchor="middle" class="body">PROXY 组选择线路</text>
  <text x="180" y="349" text-anchor="middle" class="small">应用通过系统代理或 TUN 接入</text>

  <rect x="390" y="228" width="220" height="145" rx="14" class="box"/>
  <rect x="390" y="228" width="220" height="6" rx="3" fill="#07866c"/>
  <text x="500" y="265" text-anchor="middle" class="heading">香港 Evoxt</text>
  <text x="500" y="295" text-anchor="middle" class="body">HAProxy · TCP 转发</text>
  <text x="500" y="323" text-anchor="middle" class="body">IPv6 入口 :443</text>
  <text x="500" y="349" text-anchor="middle" class="small">家庭 IPv6 网段入站白名单</text>

  <rect x="670" y="228" width="220" height="145" rx="14" class="box"/>
  <rect x="670" y="228" width="220" height="6" rx="3" fill="#07866c"/>
  <text x="780" y="265" text-anchor="middle" class="heading">美国 BlossomHost</text>
  <text x="780" y="295" text-anchor="middle" class="body">Xray · VLESS Reality</text>
  <text x="780" y="323" text-anchor="middle" class="body">IPv4 节点 :443</text>
  <text x="780" y="349" text-anchor="middle" class="small">处理 Reality 握手与出网</text>

  <rect x="952" y="254" width="112" height="95" rx="14" class="box"/>
  <text x="1008" y="290" text-anchor="middle" class="heading">目标网站</text>
  <text x="1008" y="320" text-anchor="middle" class="small">美国出口 IP</text>

  <path d="M295 301H386" class="green"/>
  <text x="341" y="284" text-anchor="middle" class="small">IPv6</text>
  <path d="M610 301H666" class="green"/>
  <text x="638" y="284" text-anchor="middle" class="small">IPv4</text>
  <path d="M890 301H947" class="green"/>

  <rect x="36" y="479" width="1048" height="208" rx="18" fill="#fff" stroke="#dce4ef"/>
  <text x="58" y="511" class="small">监控数据 · 虚线为采集关系</text>
  <path d="M180 373V526H353" class="data"/>
  <text x="180" y="467" text-anchor="middle" class="small">Mihomo API</text>
  <path d="M500 373V531" class="data"/>
  <text x="500" y="467" text-anchor="middle" class="small">SSH / Linux 指标</text>
  <path d="M780 373V526H647" class="data"/>
  <text x="780" y="467" text-anchor="middle" class="small">SSH / Linux 指标</text>

  <rect x="65" y="552" width="235" height="105" rx="12" fill="#f1f5f9"/>
  <text x="182" y="584" text-anchor="middle" class="heading">主动探测</text>
  <text x="182" y="612" text-anchor="middle" class="small">分段 TCP · 网站响应 · 出口 IP</text>
  <text x="182" y="637" text-anchor="middle" class="small">独立客户端对照下载测速</text>

  <rect x="355" y="533" width="290" height="124" rx="12" fill="#f1f5f9"/>
  <text x="500" y="564" text-anchor="middle" class="heading">Python 采集服务</text>
  <text x="500" y="592" text-anchor="middle" class="small">客户端约 2 秒 · 服务器/链路约 30 秒</text>
  <text x="500" y="620" text-anchor="middle" class="body">SQLite · 七天历史采样</text>
  <text x="500" y="643" text-anchor="middle" class="small">资源状态 / 流量 / 延迟 / 采样成功率</text>
  <path d="M300 603H350" class="data"/>
  <path d="M645 595H750" class="data"/>
  <text x="699" y="578" text-anchor="middle" class="small">JSON API</text>
  <rect x="755" y="552" width="282" height="105" rx="12" fill="#f1f5f9"/>
  <text x="896" y="584" text-anchor="middle" class="heading">HTML / JavaScript 面板</text>
  <text x="896" y="612" text-anchor="middle" class="body">定时拉取 · 状态与趋势展示</text>
  <text x="896" y="637" text-anchor="middle" class="small">仅本地采集与展示</text>
  <rect x="245" y="396" width="630" height="36" rx="8" fill="#edf3fa"/>
  <text x="560" y="419" text-anchor="middle" class="body">Reality 会话连接本机与美国节点，香港仅转发加密字节流</text>
</svg>
