<svg
  xmlns="http://www.w3.org/2000/svg"
  width="1120"
  height="580"
  viewBox="0 0 1120 580"
  role="img"
  aria-labelledby="title desc"
>
  <title id="title">从按需查资料到个人信息流</title>
  <desc id="desc">
    多平台内容由 info-collector 采集。Codex
    按任务调用采集器进行调查；拾流后端复用采集器保存内容，结合 DeepSeek
    分析和用户反馈，在网页中展示推荐与搜索结果。
  </desc>
  <defs>
    <marker
      id="arrow"
      markerWidth="9"
      markerHeight="9"
      refX="7"
      refY="4.5"
      orient="auto"
    >
      <path d="M0 0L9 4.5L0 9Z" fill="#64748b" />
    </marker>
  </defs>
  <style>
    text {
      font-family: "Microsoft YaHei", "PingFang SC", Arial, sans-serif;
      fill: #172b43;
    }
    .heading {
      font-size: 30px;
      font-weight: 700;
    }
    .label {
      font-size: 25px;
      font-weight: 700;
    }
    .body {
      font-size: 21px;
    }
    .muted {
      font-size: 19px;
      fill: #526477;
    }
    .line {
      fill: none;
      stroke: #64748b;
      stroke-width: 2.5;
      marker-end: url(#arrow);
    }
  </style>
  <rect
    x="1"
    y="1"
    width="1118"
    height="578"
    rx="24"
    fill="#f8fafc"
    stroke="#dce4eb"
  />
  <text x="40" y="57" class="heading">同一组采集工具，两种使用方式</text>
  <text x="40" y="92" class="muted">
    先按问题查资料，再把收集能力复用为自己的阅读入口
  </text>

  <rect
    x="40"
    y="160"
    width="270"
    height="300"
    rx="18"
    fill="#ffffff"
    stroke="#ccd7e2"
  />
  <text x="64" y="207" class="label">各信息源</text>
  <text x="64" y="257" class="body">小红书 / X / Instagram</text>
  <text x="64" y="299" class="body">知乎 / B 站</text>
  <text x="64" y="341" class="body">Hugging Face / arXiv</text>
  <text x="64" y="383" class="body">RSS / 公众号链接</text>
  <text x="64" y="430" class="muted">按各来源支持的能力读取</text>

  <rect
    x="370"
    y="218"
    width="285"
    height="184"
    rx="18"
    fill="#eaf7f2"
    stroke="#99cdb9"
  />
  <text x="396" y="264" class="label">info-collector</text>
  <text x="396" y="306" class="body">搜索、详情、结果文件</text>
  <text x="396" y="344" class="body">一个来源一个 CLI 入口</text>
  <text x="396" y="378" class="muted">登录与接口适配留在这一层</text>
  <path d="M310 310H360" class="line" />

  <rect
    x="728"
    y="138"
    width="352"
    height="150"
    rx="18"
    fill="#eef3ff"
    stroke="#afc2e8"
  />
  <text x="754" y="179" class="label">Codex · 按需调查</text>
  <text x="754" y="220" class="body">选择来源 → 补查 → 阅读解释</text>
  <text x="754" y="260" class="muted">围绕这次的问题组合调用</text>
  <path d="M655 270H688V213H718" class="line" />

  <rect
    x="728"
    y="325"
    width="352"
    height="190"
    rx="18"
    fill="#fff7ea"
    stroke="#e3c995"
  />
  <text x="754" y="367" class="label">拾流 · 日常浏览</text>
  <text x="754" y="408" class="body">保存 → 排序 → 网页阅读</text>
  <text x="754" y="448" class="body">DeepSeek：兴趣 / 搜索 / 摘要</text>
  <text x="754" y="488" class="muted">用户反馈与规则共同调整推荐</text>
  <path d="M655 350H688V420H718" class="line" />

  <text x="40" y="540" class="muted">
    采集、模型处理与推荐分工；原文和来源链接始终保留。
  </text>
</svg>
